{{- if and .Values.enableSubstrate .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-substrate-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: csi-substrate-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csi-substrate-controller
    spec:
      serviceAccountName: alicloud-csi-substrate
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: bridge
          image: {{ include "imageSpec" (list .Values "controller") }}
          args:
            - --driver=substrate.csi.alibabacloud.com
            - --endpoint=unix:///csi/csi.sock
            - --run-controller-service=true
            - --run-node-service=false
            - --nodeid=$(KUBE_NODE_NAME)
            {{- include "substrate.apiArgs" . | nindent 12 }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            {{- include "networkEnv" .Values.deploy | nindent 12 }}
            {{- if .Values.deploy.regionID }}
            - name: REGION_ID
              value: {{ .Values.deploy.regionID | quote }}
            {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: csi, mountPath: /csi}
            - {name: ateapi, mountPath: /run/ateapi, readOnly: true}
        - name: envoy
          image: {{ .Values.substrate.envoyImage | quote }}
          args: [-c, /etc/envoy/envoy.yaml, --log-level, warning]
          ports:
            - {name: grpc-tls, containerPort: 8443}
          readinessProbe:
            tcpSocket: {port: grpc-tls}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: csi, mountPath: /csi}
            - {name: envoy, mountPath: /etc/envoy, readOnly: true}
            - {name: serving, mountPath: /run/serving, readOnly: true}
            - {name: clients, mountPath: /run/clients, readOnly: true}
      volumes:
        - name: csi
          emptyDir: {}
        - name: envoy
          configMap: {name: csi-substrate-controller-envoy}
        - name: serving
          projected:
            sources:
              - podCertificate:
                  signerName: servicedns.podcert.ate.dev/identity
                  keyType: ECDSAP256
                  credentialBundlePath: credential-bundle.pem
        - name: clients
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: podidentity.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels: {podcert.ate.dev/canarying: live}
                  path: trust-bundle.pem
        {{- include "substrate.apiVolume" . | nindent 8 }}
{{- end }}
